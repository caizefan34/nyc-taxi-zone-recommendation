# Forecast Benchmark Configuration
name: forecast_benchmark
version: "2.0.0"
metrics:
  - name: MAE
    higher_is_better: false
  - name: RMSE
    higher_is_better: false
  - name: SMAPE
    higher_is_better: false
baselines:
  - name: historical_average
    type: heuristic
  - name: lightgbm
    type: ml
  - name: xgboost
    type: ml
  - name: graphsage
    type: gn
  - name: ensemble
    type: ensemble
