services:
  api:
    build:
      context: .
      target: api
    image: nyc-taxi-api:latest
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      DEMO_MODE: sample
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  demo:
    build:
      context: .
      target: demo
    image: nyc-taxi-demo:latest
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      DEMO_MODE: sample
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    image: nyc-taxi-test:latest
    environment:
      PYTHONPATH: /app
