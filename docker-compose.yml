services:
  api:
    build:
      context: .
      target: api
    image: nyc-taxi-api:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - PYTHONPATH=/app
      - DEMO_MODE=sample
    restart: unless-stopped

  demo:
    build:
      context: .
      target: demo
    image: nyc-taxi-demo:latest
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - PYTHONPATH=/app
      - DEMO_MODE=sample
    depends_on:
      - api
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    image: nyc-taxi-test:latest
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - PYTHONPATH=/app
    command: ["pytest", "tests/", "-q", "--tb=short", "-o", "addopts="]
