# =============================================================================
# Experiment Manifest
# =============================================================================
manifest:
  version: "1.0.0"
  date: "2026-07-26"
  repository: "https://github.com/caizefan34/nyc-taxi-zone-recommendation"
  branch: "release-preparation"

dataset:
  source: "NYC TLC Yellow Taxi Trip Records"
  years: [2022, 2023, 2024, 2025]
  zones: 263
  total_trips_approx: 115000000
  cleaning:
    max_trip_duration_minutes: 240
    min_trip_duration_minutes: 1
    max_fare_usd: 200
    min_fare_usd: 0
    max_trip_distance_miles: 100
    min_trip_distance_miles: 0.1
    max_speed_mph: 80
  splits:
    train: ["2022-01-01", "2023-12-31"]
    validation: ["2024-01-01", "2024-12-31"]
    test: ["2025-01-01", "2025-12-31"]
  config_file: "configs/dataset.yaml"

models:
  forecasting:
    - name: "Historical Average"
      type: "baseline"
      params: {}
    - name: "LightGBM"
      type: "gradient_boosting"
      params:
        n_estimators: 500
        learning_rate: 0.05
        max_depth: 8
        num_leaves: 64
        min_data_in_leaf: 100
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 5
        early_stopping_rounds: 50
        seed: 42
      config_file: "configs/model.yaml"
    - name: "Selected Ensemble"
      type: "blend"
      description: "0.75 LightGBM + 0.25 historical (demand); 0.85 LightGBM + 0.15 historical (fare)"
  graph:
    name: "GraphSAGE"
    params:
      hidden_dim: 64
      n_layers: 2
      dropout: 0.2
      learning_rate: 0.001
      epochs: 200
      patience: 20
    config_file: "configs/model.yaml"
  dqn:
    gamma: 0.99
    learning_rate: 0.001
    batch_size: 64
    replay_capacity: 20000
    target_update_interval: 250
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 10000
    hidden_sizes: [128, 128]
  double_dqn:
    gamma: 0.99
    learning_rate: 0.001
    batch_size: 64
    replay_capacity: 20000
    target_update_interval: 250
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 10000
    hidden_sizes: [128, 128]
  iql:
    algorithm: "Implicit Q-Learning"
    gamma: 0.99
    tau: 0.7
    beta: 3.0
    learning_rate: 0.0003
    hidden_dim: 256
    batch_size: 256
    n_critics: 2
    expectile_threshold: 0.005
    training_steps: 10000
    log_interval: 500
    config_file: "configs/model.yaml"

simulator:
  name: "DynamicSimulator v2"
  config_file: "configs/simulator.yaml"
  drivers: 50
  start_locations: [132]
  horizon_days: 7
  slot_minutes: 30
  zone_count: 263
  dynamics:
    base_half_saturation: 40.0
    supply_elasticity: 0.3
    traffic_demand_suppression: 0.15
  reward_components:
    fuel_cost_per_mile: 0.65
    time_cost_per_minute: 0.30
    competition_penalty_per_driver: 0.50
    risk_aversion_factor: 2.0
    base_fare_per_trip: 15.0
    fare_per_mile: 2.50
  calibration:
    config_file: "configs/calibration.yaml"
    demand_factor: 1.0
    demand_offset: 0.0
    fare_factor: 0.80
    fare_offset: 0.0
    travel_time_factor: 1.0
    reward_factor: 0.80

rl_training:
  config_file: "configs/rl.yaml"
  env:
    candidate_count: 20
    background_driver_count: 49
    demand_supply_ratio: 1.0
    reward_scale: 0.05
    relocation_penalty: 0.25
    failed_pickup_penalty: 1.0
  training:
    episodes: 500
    seed: 20230722
    device: "cpu"
  offline:
    buffer_capacity: 100000
    state_dim: 7
    action_dim: 263
    collect_episodes: 20
    iql_update_steps: 10000
    device: "cpu"
  seeds: [42]

evaluation:
  metrics: ["MAE", "RMSE", "NDCG@3", "Hit@3", "revenue", "utilization", "episode_return"]
  ope_methods: ["FQE", "WIS", "DR"]
  bootstrap_resamples: 2000
  ope_bootstrap_samples: 100
  effect_size: "Cohen's d"
  significance_level: 0.05
  runs: 20
  drivers: 50
  horizon_days: 7
  seed: 42

outputs:
  forecast: "outputs/forecast_evaluation.md"
  benchmark_report: "outputs/benchmark_report.md"
  benchmark_statistics: "outputs/benchmark_statistics.md"
  calibration_validation: "outputs/calibration_validation_report.md"
  cross_year_benchmark: "outputs/cross_year_benchmark.md"
  policy_evaluation: "outputs/policy_evaluation_report.md"
  simulator_validation: "outputs/simulator_validation_report.md"
  figures_dir: "docs/results/"
