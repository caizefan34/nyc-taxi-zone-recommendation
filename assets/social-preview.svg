<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="40%" style="stop-color:#0d1b3e"/>
      <stop offset="70%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1150" cy="100" r="220" fill="rgba(96,165,250,0.02)" stroke="rgba(96,165,250,0.06)" stroke-width="1"/>
  <circle cx="150" cy="520" r="150" fill="rgba(167,139,250,0.02)" stroke="rgba(167,139,250,0.05)" stroke-width="1"/>
  <circle cx="640" cy="320" r="280" fill="none" stroke="rgba(96,165,250,0.03)" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- NYC skyline silhouette (simple) -->
  <g fill="rgba(96,165,250,0.06)" transform="translate(0, 640)">
    <rect x="100" y="-100" width="30" height="100" rx="2"/>
    <rect x="135" y="-140" width="25" height="140" rx="2"/>
    <rect x="165" y="-80" width="35" height="80" rx="2"/>
    <rect x="210" y="-180" width="20" height="180" rx="2"/>
    <rect x="240" y="-120" width="28" height="120" rx="2"/>
    <rect x="275" y="-60" width="32" height="60" rx="2"/>
    <rect x="315" y="-160" width="22" height="160" rx="2"/>
    <rect x="345" y="-90" width="30" height="90" rx="2"/>
    <rect x="380" y="-130" width="25" height="130" rx="2"/>
    <rect x="410" y="-70" width="28" height="70" rx="2"/>
    <rect x="445" y="-150" width="20" height="150" rx="2"/>
    <rect x="470" y="-100" width="30" height="100" rx="2"/>
    <rect x="505" y="-170" width="18" height="170" rx="2"/>
  </g>

  <!-- Main title -->
  <text x="80" y="150" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',sans-serif" font-size="58" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)">Urban Mobility</text>
  <text x="80" y="230" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',sans-serif" font-size="58" font-weight="800" fill="#f1f5f9">Decision Intelligence</text>

  <!-- Subtitle -->
  <text x="80" y="280" font-family="'Segoe UI','SF Pro Display',system-ui,sans-serif" font-size="20" fill="rgba(255,255,255,0.65)">AI-Driven Fleet Repositioning · Demand Forecasting · Multi-Agent Simulation · Offline RL · Reproducible OPE</text>

  <!-- KPI Cards -->
  <rect x="80" y="330" width="250" height="120" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="105" y="365" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="rgba(255,255,255,0.4)" font-weight="600" letter-spacing="1">NDCG@3 (TWO-STEP)</text>
  <text x="105" y="420" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="52" font-weight="800" fill="#60a5fa">0.9565</text>

  <rect x="355" y="330" width="250" height="120" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="380" y="365" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="rgba(255,255,255,0.4)" font-weight="600" letter-spacing="1">DAILY FARE LIFT</text>
  <text x="380" y="420" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="52" font-weight="800" fill="#34d399">+$139.40</text>

  <rect x="630" y="330" width="250" height="120" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="655" y="365" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="rgba(255,255,255,0.4)" font-weight="600" letter-spacing="1">DQN LIFT / DRIVER</text>
  <text x="655" y="420" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="52" font-weight="800" fill="#fbbf24">+$53.74</text>

  <rect x="905" y="330" width="295" height="120" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="930" y="365" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="rgba(255,255,255,0.4)" font-weight="600" letter-spacing="1">BENCHMARK</text>
  <text x="930" y="420" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="52" font-weight="800" fill="#f472b6">263 Zones</text>

  <!-- Bottom bar -->
  <rect x="80" y="490" width="1120" height="1" fill="rgba(255,255,255,0.08)"/>
  <text x="80" y="535" font-family="'SF Mono','Fira Code',monospace" font-size="16" fill="rgba(255,255,255,0.35)">
    Python 3.10+ · LightGBM · XGBoost · GraphSAGE · DQN · IQL · FastAPI · Docker · MIT
  </text>
  <text x="80" y="575" font-family="'SF Mono','Fira Code',monospace" font-size="15" fill="rgba(255,255,255,0.2)">
    github.com/caizefan34/urban-mobility-ai · v3.0.0 · Reproducible Research
  </text>

  <!-- SJTU badge -->
  <rect x="1040" y="555" width="160" height="28" rx="6" fill="rgba(96,165,250,0.08)" stroke="rgba(96,165,250,0.15)" stroke-width="1"/>
  <text x="1120" y="574" font-family="'SF Pro Display',sans-serif" font-size="12" fill="rgba(96,165,250,0.6)" text-anchor="middle">Shanghai Jiao Tong Univ.</text>
</svg>
