name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: How should it work? Be as specific as possible.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Scope
      description: Is this for research, engineering, or both?
      options: [Research, Engineering, Both]
  - type: textarea
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you've considered
  - type: textarea
    attributes:
      label: References
      description: Papers, projects, or docs that inspire this request
