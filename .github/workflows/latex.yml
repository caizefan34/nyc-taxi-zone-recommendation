name: Compile LaTeX Report
on:
  push:
    branches: [master, main]
    paths:
      - 'report/**'
      - 'outputs/**'
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: report.tex
          compiler: xelatex
          working_directory: report/
      - name: Create paper directory
        run: mkdir -p paper
      - name: Copy PDF to paper/
        run: cp report/report.pdf paper/report.pdf
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: paper/report.pdf
