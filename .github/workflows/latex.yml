name: Compile LaTeX Paper and Deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'report/**'
      - 'outputs/**'
      - 'docs/research_paper_draft.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: report.tex
          compiler: xelatex
          working_directory: report/
        continue-on-error: true

      - name: Copy PDF to site
        run: |
          mkdir -p _site
          cp report/report.pdf _site/paper.pdf 2>/dev/null || echo "No LaTeX PDF generated"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-latex
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}/paper.pdf
    runs-on: ubuntu-latest
    steps:
      - name: Deploy paper PDF
        id: deployment
        uses: actions/deploy-pages@v4
