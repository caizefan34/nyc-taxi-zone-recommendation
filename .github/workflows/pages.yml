name: Deploy Unified Site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Build Sphinx docs into /docs/ subpath
        run: |
          cd docs
          sphinx-build -b html . _build/html/docs

      - name: Build self-contained web app
        run: |
          python scripts/build_web.py

      - name: Copy web demo to /web/
        run: |
          mkdir -p docs/_build/html/web
          cp -r web/index.html web/css web/js web/data web/assets docs/_build/html/web/ 2>/dev/null || true

      - name: Copy landing page to root
        run: |
          cp pages/index.html docs/_build/html/index.html

      - name: Copy assets
        run: |
          mkdir -p docs/_build/html/assets
          cp -r assets/* docs/_build/html/assets/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
