name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check src/ tests/ scripts/ benchmark/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs dependencies
        run: python -m pip install sphinx sphinx-rtd-theme myst-parser
      - name: Build docs with warnings-as-errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev,data,forecasting,graph,rl,api,demo]"
      - name: Run tests
        run: pytest tests/ --cov=src/ --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          docker build --target api -t nyc-taxi-api:ci .
          docker build --target demo -t nyc-taxi-demo:ci .
          docker build --target test -t nyc-taxi-test:ci .
      - name: Run container import smoke
        run: docker run --rm nyc-taxi-test:ci python -c "import polars, torch; from src.api.main import app; assert app"
      - name: Run API health smoke
        run: |
          docker run -d --rm --name nyc-taxi-api -p 8000:8000 nyc-taxi-api:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs nyc-taxi-api
          exit 1
