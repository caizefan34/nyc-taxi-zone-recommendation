[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-mobility-ai"
version = "3.0.0"
description = "Open-source decision intelligence platform for AI-driven fleet repositioning — demand forecasting, multi-agent simulation, offline RL & reproducible OPE on NYC taxi data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zefan Cai", email = "caizefan@sjtu.edu.cn"}
]
keywords = ["reinforcement-learning", "offline-rl", "off-policy-evaluation", "demand-forecasting", "decision-intelligence", "multi-agent-simulation", "urban-mobility", "smart-city", "benchmark", "reproducible-research", "spatiotemporal", "graph-neural-networks", "recommender-system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://caizefan34.github.io/urban-mobility-ai/"
Documentation = "https://caizefan34.github.io/urban-mobility-ai/docs/"
Repository = "https://github.com/caizefan34/urban-mobility-ai"
Issues = "https://github.com/caizefan34/urban-mobility-ai/issues"
Discussions = "https://github.com/caizefan34/urban-mobility-ai/discussions"

[project.optional-dependencies]
data = [
    "polars>=1.0",
]
api = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.29",
]
demo = [
    "streamlit>=1.32",
]
agent = [
    "anthropic>=0.40",
]

dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]
forecasting = [
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
graph = [
    "torch>=2.2",
]
rl = [
    "gymnasium>=1.0,<2",
    "torch>=2.2",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=src/ --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
exclude = ["archive/"]
ignore = ["E702", "E701", "W293", "N806", "F841", "F821"]

[tool.black]
line-length = 120
target-version = ["py310"]
